name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Vite+
        run: curl -fsSL https://vite.plus | bash
      - name: Install dependencies
        run: ~/.vite-plus/bin/vp install --frozen-lockfile
      - name: Validate
        run: ~/.vite-plus/bin/vp run ready
